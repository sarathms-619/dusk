<style>
:root{
  --sky-apricot:#F9DCC4; --sky-peach:#F5C6B4; --sky-rose:#E9B8C6; --sky-lavender:#D9CBEA; --sky-periwinkle:#C9D3F0;
  --paper:#FDF8F4; --card:#FFFFFF; --ink:#2B2547; --ink-2:#55507A; --ink-3:#8A86A8; --line:rgba(43,37,71,.12);
  --sun:#E9A15B; --plum:#7D5B9B; --plum-soft:rgba(125,91,155,.10); --gold:#B8925A;
  --title:'Cinzel','Trajan Pro','Times New Roman',serif;
  --display:'IM Fell English','Iowan Old Style',Georgia,serif;
  --body:'Alegreya','Palatino Linotype',Palatino,Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper)}
html,body{margin:0;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{background:transparent;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
.sky{position:fixed;inset:0 0 auto 0;height:62vh;background:linear-gradient(180deg,var(--sky-periwinkle) 0%,var(--sky-lavender) 30%,var(--sky-rose) 62%,var(--sky-peach) 82%,var(--paper) 100%);z-index:-1}
body[data-sky="letting-go"] .sky{background:linear-gradient(180deg,#F7E2CF 0%,var(--sky-apricot) 28%,var(--sky-peach) 58%,#F9E6DA 82%,var(--paper) 100%)}
body[data-sky="threshold"] .sky{background:linear-gradient(180deg,var(--sky-lavender) 0%,#DFC3DC 35%,var(--sky-rose) 62%,#F4D3CC 84%,var(--paper) 100%)}
body[data-sky="return"] .sky{background:radial-gradient(circle at 78% 9%,#fff 0 2px,rgba(255,255,255,.55) 3px,transparent 8px),linear-gradient(180deg,#BFCBEE 0%,var(--sky-periwinkle) 30%,var(--sky-lavender) 62%,#EDE4F2 84%,var(--paper) 100%)}
.path{width:100%;height:auto;display:block}
.path-labels{display:flex;justify-content:space-between;font-family:var(--title);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.path-labels b{color:var(--plum);font-weight:500}
.waiting{display:flex;gap:14px;align-items:center}
.waiting .backs{display:flex;flex-shrink:0}
.waiting .backs .artcard{width:38px;margin-left:-18px;filter:saturate(.5) drop-shadow(0 4px 8px rgba(43,37,71,.12));opacity:.85}
.waiting .backs .artcard:first-child{margin-left:0}
.install{display:grid;gap:6px;text-align:center}
main{max-width:480px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 48px max(18px,env(safe-area-inset-left,0px));display:grid;gap:18px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:400;text-wrap:balance}
h2{font-size:30px;line-height:1.15}
h3{font-size:22px;line-height:1.2}
p{margin:0}
.top{display:flex;justify-content:space-between;align-items:center}
.nav{display:flex;align-items:center;gap:14px}
.mark{font-family:var(--title);letter-spacing:.24em;font-size:15px;color:var(--ink)}
.markbtn{appearance:none;background:none;border:0;padding:4px 0;cursor:pointer}
.navbtn{text-decoration:none;font-size:16px;padding:6px 0}
.mark b{color:var(--plum);font-weight:500}
.eyebrow{font-family:var(--title);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--plum)}
.muted{color:var(--ink-2)}
.small{font-size:15px}
.hero{padding-block:44px 8px;display:grid;gap:14px;text-align:center;justify-items:center}
.hero h1{font-family:var(--title);font-size:64px;letter-spacing:.14em;font-weight:500;line-height:1}
.hero h1 em{font-style:normal;color:var(--plum)}
.tagline{font-family:var(--display);font-style:italic;font-size:24px;line-height:1.3;max-width:20ch}
.sun{width:120px;height:60px;overflow:hidden;position:relative;margin-top:8px}
.sun::before{content:"";position:absolute;left:0;top:0;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#FBE3C2 0%,var(--sun) 60%,#E48E4E 100%);box-shadow:0 0 50px 16px rgba(233,161,91,.35)}
.panel{background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:14px;backdrop-filter:blur(6px)}
.btn{appearance:none;border:0;border-radius:14px;background:var(--ink);color:#fff;font-family:var(--body);font-size:17px;font-weight:700;padding:14px 18px;cursor:pointer;text-align:center;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--plum-soft);color:var(--plum)}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.pick:focus-visible,.link:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.link{appearance:none;background:none;border:0;color:var(--plum);font-family:var(--body);font-size:15px;cursor:pointer;padding:4px;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:999px;padding:7px 13px;font-family:var(--body);font-size:16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff}
textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:var(--body);font-size:17px;color:var(--ink);background:#fff;resize:vertical;line-height:1.5}
textarea:focus{outline:2px solid rgba(125,91,155,.35);border-color:var(--plum)}
.opts{display:grid;gap:10px}
.opt{appearance:none;display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;cursor:pointer;text-align:left;font-family:var(--body);color:var(--ink)}
.opt b{font-family:var(--title);font-size:24px;font-weight:500;color:var(--plum);min-width:2ch;text-align:right}
.opt span small{display:block;color:var(--ink-3);font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--plum);background:var(--plum-soft)}
.progress{display:flex;gap:3px}
.progress i{flex:1;height:8px;border-radius:4px;background:rgba(43,37,71,.08)}
.progress i.letting-go{background:rgba(245,198,180,.55)} .progress i.threshold{background:rgba(217,203,234,.75)} .progress i.return{background:rgba(233,161,91,.35)}
.progress i.done.letting-go{background:#E9A58E} .progress i.done.threshold{background:#A991C9} .progress i.done.return{background:var(--sun)}
.progress i.now{outline:2px solid var(--ink);outline-offset:1px}
.sunset{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--ink-2);background:rgba(255,255,255,.6);border-radius:12px;padding:8px 12px}
.picks{display:flex;justify-content:center;gap:12px;padding-block:10px}
.pick{appearance:none;border:0;background:none;padding:0;width:30%;max-width:120px;cursor:pointer;transition:transform .25s ease}
.pick[aria-pressed="true"]{transform:translateY(-12px)}
.pick[aria-pressed="true"] .artcard{filter:drop-shadow(0 14px 18px rgba(125,91,155,.35))}
.artcard{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 14px rgba(43,37,71,.12))}
.reveal{display:grid;justify-items:center;gap:14px;text-align:center}
.reveal .artcard{max-width:220px}
@media (prefers-reduced-motion:no-preference){.reveal .artcard{animation:turn .7s ease both}@keyframes turn{from{transform:rotateY(90deg);opacity:.2}to{transform:none;opacity:1}}}
.question{font-family:var(--display);font-style:italic;font-size:24px;line-height:1.3}
.reader{border-left:3px solid var(--plum);padding-left:14px;font-family:var(--display);font-size:21px;line-height:1.45}
.support{background:#FFF5EC;border:1px solid rgba(233,161,91,.5);border-radius:16px;padding:16px;display:grid;gap:6px;font-size:16px}
.support b{font-size:17px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.strip button{appearance:none;border:0;background:none;padding:0;cursor:pointer}
.reading{display:grid;gap:10px}
.reading p{font-size:17px}
.entry{border-top:1px solid var(--line);padding-top:12px;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}
.entry > div{min-width:0;display:grid;gap:4px}
.entry .q{font-family:var(--display);font-style:italic;font-size:17px}
.entry .w{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}
.entry .r{font-size:15px;color:var(--plum)}
.signin{display:grid;justify-items:center;gap:8px;min-height:44px}
.error{color:#A23B3B;font-size:15px}
.loading{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:16px}
.loading::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--plum);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1}
footer{text-align:center;font-size:13px;color:var(--ink-3);padding-top:8px}
.why{font-size:15px;color:var(--ink-2);border-left:2px solid var(--sun);padding-left:10px}
.opt span small.best{color:var(--ink-2);font-size:14px;margin-top:2px}
.expect{display:grid;gap:6px;font-size:15.5px;color:var(--ink-2)}
.expect li{margin-left:-6px}
.expect ul{margin:0;padding-left:18px;display:grid;gap:4px}
.compass{display:grid;gap:14px}
.crow{display:grid;gap:4px}
.crow label{display:flex;justify-content:space-between;font-size:16px}
.crow label output{font-family:var(--title);color:var(--plum);min-width:2ch;text-align:right}
.crow input[type=range]{width:100%;accent-color:var(--plum)}
.crow .ends{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3)}
.wx{display:flex;flex-wrap:wrap;gap:8px}
.wx .chip i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.moved{display:grid;gap:12px}
.mrow{display:grid;gap:4px;font-size:15.5px}
.mrow .bar{position:relative;height:16px}
.mrow .bar::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:rgba(43,37,71,.10);border-radius:2px}
.mrow .bar i{position:absolute;top:2px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%)}
.mrow .bar i.a{background:#fff;border:2px solid var(--ink-3)}
.mrow .bar i.b{background:var(--sun)}
.mrow .bar b{position:absolute;top:7px;height:2px;background:var(--sun)}
.mrow .lbl{display:flex;justify-content:space-between}
.mrow .lbl span:last-child{color:var(--ink-2);font-variant-numeric:tabular-nums}
.wstrip{display:flex;flex-wrap:wrap;gap:4px}
.wstrip i{width:16px;height:16px;border-radius:4px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.guide h3{margin-bottom:2px}
.guide p,.guide li{font-size:16.5px}
.guide ul{margin:0;padding-left:20px;display:grid;gap:6px}
.guide .src{font-size:14px;color:var(--ink-3)}
.guide .src a{color:var(--plum)}
</style>

<body>
<div class="sky" aria-hidden="true"></div>
<main id="app" aria-live="polite"><p class="loading">Opening Dusk…</p></main>
<script src="art.js"></script>
<script>
const CONFIG = {
  api: location.hostname === "localhost" ? "http://localhost:8787" : "https://dusk-worker.rey619-ms.workers.dev",
  googleClientId: "707397213573-os17j541rvl77qnc7085f1pafeimulha.apps.googleusercontent.com",
};
const SPLITS = { 3: [1, 1, 1], 7: [2, 3, 2], 21: [4, 13, 4], 40: [7, 26, 7] };
const MOVEMENT_NAME = { "letting-go": "The Letting Go", threshold: "The Threshold", return: "The Return" };
const JUNCTIONS = ["A job", "A role", "A city", "A relationship", "A loss", "A chapter", "Something else"];
const LENGTHS = [
  { n: 3, name: "One dusk", sub: "3 cards, all tonight",
    best: "For a moment rather than a season: the night before an interview, the day after a hard conversation.",
    why: "A beginning, a middle and an end in one sitting. Every rite of passage moves through those three phases, and here you walk them in ten minutes." },
  { n: 7, name: "A week", sub: "7 evenings",
    best: "For a contained change you're already inside: a new team, the first week after resigning, a move you've just made.",
    why: "Long enough to notice a pattern, short enough to finish. Two evenings of letting go, three at the threshold, two to return." },
  { n: 21, name: "Three weeks", sub: "21 evenings",
    best: "For a transition that's still unfolding: a job search, a role change, the early weeks after an ending.",
    why: "Three weeks gives the Reader three weekly readings, enough to see what repeats in your cards and your words. It isn't because habits take 21 days; research says they don't." },
  { n: 40, name: "A mandala", sub: "40 evenings",
    best: "For the big crossings: a layoff, a loss, a new chapter of life.",
    why: "Forty days is a traditional length for a sustained practice, the mandala of daily practice in yoga among them. It gives the longest Threshold, 26 evenings, for change that takes time." },
];
const WEATHER = [
  { id: "stormy", label: "Stormy", c: "#8E86A8" }, { id: "heavy", label: "Heavy", c: "#A991C9" },
  { id: "foggy", label: "Foggy", c: "#CFC8DD" }, { id: "still", label: "Still", c: "#C9D3F0" },
  { id: "clear", label: "Clear", c: "#F3C99A" }, { id: "bright", label: "Bright", c: "#E9A15B" },
];
const WX = Object.fromEntries(WEATHER.map((w) => [w.id, w]));
const COMPASS = [
  { k: "steadiness", q: "How steady do I feel?", lo: "Shaken", hi: "Steady" },
  { k: "clarity", q: "How clear is my next step?", lo: "No idea yet", hi: "Clear" },
  { k: "hope", q: "How hopeful do I feel?", lo: "Low", hi: "Hopeful" },
];
const ANSWERS = { yes: "Yes", partly: "Partly", "not-yet": "Not yet" };
let CARDS = [], CARD = {};
const app = document.getElementById("app");
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem("dusk." + k)); } catch { return null; } },
  set(k, v) { try { v === null ? localStorage.removeItem("dusk." + k) : localStorage.setItem("dusk." + k, JSON.stringify(v)); } catch {} },
};
if (new URLSearchParams(location.search).get("test") === "1") store.set("test", true);
if (new URLSearchParams(location.search).get("test") === "0") store.set("test", null);
const testMode = () => Boolean(store.get("test"));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const movementFor = (len, n) => { const [l, t] = SPLITS[len]; return n <= l ? "letting-go" : n <= l + t ? "threshold" : "return"; };
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000);
const fmtDate = (s) => s ? new Date(s + "T12:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short" }) : "";

async function api(path, body) {
  const session = store.get("session");
  const res = await fetch(CONFIG.api + path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json", ...(session ? { Authorization: "Bearer " + session } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== "/auth/google") { store.set("session", null); store.set("user", null); }
  if (!res.ok) throw new Error(data.error || "Dusk couldn't reach its server. Check your connection and try again.");
  return data;
}

// ---------- Sunset (NOAA sunrise equation), worked out on the device ----------
function sunsetFor(date, lat, lon) {
  const rad = Math.PI / 180, N = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
  const lngHour = lon / 15, t = N + (18 - lngHour) / 24, M = 0.9856 * t - 3.289;
  let L = (M + 1.916 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 282.634) % 360; if (L < 0) L += 360;
  let RA = Math.atan(0.91764 * Math.tan(L * rad)) / rad; RA = (RA + 360) % 360;
  RA = (RA + (Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90)) / 15;
  const sinDec = 0.39782 * Math.sin(L * rad), cosDec = Math.cos(Math.asin(sinDec));
  const cosH = (Math.cos(90.833 * rad) - sinDec * Math.sin(lat * rad)) / (cosDec * Math.cos(lat * rad));
  if (cosH < -1 || cosH > 1) return null;
  const H = Math.acos(cosH) / rad / 15, T = H + RA - 0.06571 * t - 6.622;
  let UT = (T - lngHour) % 24; if (UT < 0) UT += 24;
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate())); d.setUTCMinutes(Math.round(UT * 60));
  return d;
}
function sunsetLine() {
  const loc = store.get("loc");
  if (!loc) return `<div class="sunset"><span>Time the evening to your sunset</span><button class="link" data-act="locate">Use my location</button></div>`;
  const s = sunsetFor(new Date(), loc.lat, loc.lon);
  return `<div class="sunset"><span>Sunset today</span><span>${s ? s.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "—"}</span></div>`;
}
function locate() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition((p) => { store.set("loc", { lat: +p.coords.latitude.toFixed(2), lon: +p.coords.longitude.toFixed(2) }); route(); }, () => {}, { maximumAge: 86400000, timeout: 10000 });
}

// ---------- Shared pieces ----------
const topBar = (user, atHome = false) => `<div class="top"><div class="nav">${atHome ? "" : `<button class="link navbtn" data-act="home" aria-label="Back to home">← Home</button>`}<button class="mark markbtn" data-act="home" aria-label="Dusk home">D<b>U</b>SK</button></div>${user ? `<button class="link" data-act="menu">${esc(user.name ? user.name.split(" ")[0] : "Menu")}</button>` : atHome ? "" : `<button class="link" data-act="home">Sign in</button>`}</div>`;
const supportBox = () => `<div class="support" role="note"><b>You deserve support right now.</b><span>Talking to someone can help. In India, call <b>Tele-MANAS on 14416</b> (free, any time, in many languages). If you're in immediate danger, call <b>112</b>.</span></div>`;
function mini(id) { const c = CARD[id]; return c ? DuskArt.card(c, { k: "m" + Math.random().toString(36).slice(2, 7) }) : ""; }

function setSky(m) { if (m) document.body.dataset.sky = m; else delete document.body.dataset.sky; }

// The crossing drawn as a horizon: one mark per evening, the sun where you are, a star at the Return.
function crossingPath(len, done) {
  const W = 320, y = 56, x0 = 14, x1 = W - 14, step = (x1 - x0) / Math.max(len - 1, 1);
  const [l, t] = SPLITS[len];
  const xs = (i) => x0 + i * step;
  const seg = (from, to, col) => `<line x1="${xs(from)}" y1="${y}" x2="${xs(to)}" y2="${y}" stroke="${col}" stroke-width="2" stroke-linecap="round"/>`;
  const r = len > 21 ? 2.2 : len > 7 ? 3 : 4.5;
  let marks = "";
  for (let i = 0; i < len; i++) {
    const m = movementFor(len, i + 1), x = xs(i);
    const fill = i < done ? (m === "letting-go" ? "#E9A58E" : m === "threshold" ? "#A991C9" : "#E9A15B") : "#FFFFFF";
    if (i === done) marks += `<circle cx="${x}" cy="${y}" r="9" fill="#F3B577" opacity=".35"/><circle cx="${x}" cy="${y}" r="6" fill="#E9A15B"/>`;
    else if (i === len - 1) marks += `<path d="M${x} ${y - 7} L${x + 2} ${y - 2} L${x + 7} ${y} L${x + 2} ${y + 2} L${x} ${y + 7} L${x - 2} ${y + 2} L${x - 7} ${y} L${x - 2} ${y - 2} Z" fill="${i < done ? "#E9A15B" : "#FFFFFF"}" stroke="#B8925A" stroke-width=".8"/>`;
    else marks += `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="#B8925A" stroke-width=".7"/>`;
  }
  const sunX = xs(Math.min(done, len - 1));
  return `<div aria-label="${done} of ${len} evenings crossed">
  <svg class="path" viewBox="0 0 ${W} 80" aria-hidden="true">
    <path d="M${x0} ${y} Q${W / 2} ${y - 46} ${x1} ${y}" fill="none" stroke="#B8925A" stroke-width=".6" stroke-dasharray="1.5 3"/>

const STOP = new Set("that this with have just from they what when been were will would could should about there their them then than into your yours mine also because really still very much some more over only like feel feels felt know want wanted need even here where which while being does doesn't didn't don't can't it's i'm i've i'll isn't wasn't".split(" "));
function wordShift(entries) {
  const words = (s) => (String(s || "").toLowerCase().match(/[a-z']{4,}/g) || []).filter((w) => !STOP.has(w));
  const half = Math.ceil(entries.length / 2), count = (list) => list.flatMap((e) => words(e.entry)).reduce((m, w) => (m[w] = (m[w] || 0) + 1, m), {});

  let faded = null, grew = null;
  for (const w of new Set([...Object.keys(A), ...Object.keys(B)])) {
    const d = (B[w] || 0) - (A[w] || 0);
    if ((A[w] || 0) >= 2 && (!faded || d < faded.d)) faded = { w, d, a: A[w] || 0, b: B[w] || 0 };

// ---------- How Dusk works ----------
function renderGuide() {
  setSky("threshold");
  app.innerHTML = `${topBar(store.get("user"))}
  <section class="panel guide"><span class="eyebrow">How Dusk works</span><h2>A practice for the time between an ending and a beginning.</h2>
    <p>When something ends, a job, a role, a city, a relationship, there's a stretch before the next thing takes shape. Most tools rush you through it: update the CV, make a plan, move on. Dusk gives that stretch a shape instead, so you cross it rather than wait it out.</p></section>
  <section class="panel guide"><h3>When</h3><p>Once a day, at dusk. Dusk works out your local sunset and that's when your evening opens. Any time in the evening is fine; sunset is the invitation, not a deadline.</p></section>
  <section class="panel guide"><h3>What you do each evening</h3><ul>
    <li><b>Pick one of three face-down cards.</b> Choosing is part of the reflection.</li>
    <li><b>Read its meaning and one question.</b> The question is the point; the card is a way in.</li>
    <li><b>Say how the evening feels</b> in one tap: stormy, heavy, foggy, still, clear or bright.</li>
    <li><b>Write for a few minutes.</b> No word count, no right answer.</li>
    <li><b>The Reader replies</b> with one thing it noticed, sometimes linking tonight to an earlier evening.</li></ul></section>
  <section class="panel guide"><h3>What's expected of you</h3><ul>
    <li>Honesty, not eloquence. A few true lines are worth more than a polished page.</li>
    <li>Showing up most evenings. Miss one and the crossing waits for you; research on daily habits found that missing a day doesn't undo the effort.</li>
    <li>Nothing else. There are no streaks, no scores, no right cards.</li></ul></section>
  <section class="panel guide"><h3>Choosing a length</h3>${LENGTHS.map((l) => `<p><b>${l.n} · ${l.name}.</b> ${l.best} <span class="why" style="display:block;margin-top:4px">${l.why}</span></p>`).join("")}</section>
  <section class="panel guide"><h3>The three movements</h3><ul>
    <li><b>The Letting Go:</b> naming what ended and what you're still carrying. Cards of endings: Death, the Tower, the Eight of Cups.</li>
    <li><b>The Threshold:</b> the long middle, where the old self has gone and the new one hasn't formed. Cards of waiting and inner work: the Hanged Man, the Hermit, the Moon.</li>
    <li><b>The Return:</b> stepping into what's next. The Star, the Sun and the World stay locked until you reach it, and every crossing ends on the Fool.</li></ul></section>
  <section class="panel guide"><h3>What you get, and how change is tracked</h3><ul>
    <li><b>Your intention.</b> At the start you write what would make this crossing worth it. At the Return you're asked whether you found it.</li>
    <li><b>Your compass.</b> Three quick readings from 1 to 10, for steadiness, clarity about your next step and hope. You set them at the start, at each weekly check-in and at the Return.</li>
    <li><b>The weather of each evening,</b> so you can see the season you crossed.</li>
    <li><b>Your words.</b> The Scroll shows a word that faded and a word that grew between the first half and the second.</li>
    <li><b>The Crossing Scroll</b> keeps every card, every entry, the Reader's closing reflection and how you moved.</li></ul>
    <p class="muted small">Everything is self-reported and for you alone. Dusk doesn't score you or compare you with anyone.</p></section>
  <section class="panel guide"><h3>What Dusk is not</h3><ul>
    <li><b>Not fortune-telling.</b> The cards are mirrors for reflection. Dusk never predicts what will happen.</li>
    <li><b>Not therapy.</b> If you're struggling, please talk to someone. In India, Tele-MANAS is free on 14416, any time.</li>
    <li><b>Not a feed.</b> Your words are private: only you and the Reader see them.</li></ul></section>
  <section class="panel guide"><h3>Why this can help</h3>
    <p>Small rituals, even invented ones, have been shown to ease grief by restoring a sense of control, and to reduce anxiety before hard moments. Writing about difficult experiences has a modest but real benefit across many studies. Dusk combines the two: a small ritual at a fixed time of day, and a few minutes of honest writing. It makes no bigger claim than that.</p>
    <p class="src">Sources: <a href="https://dash.harvard.edu/bitstream/1/10683152/1/norton%20gino_rituals-and-grief.pdf" target="_blank" rel="noopener">Norton &amp; Gino, 2014</a> · <a href="https://static1.squarespace.com/static/5c171ac1710699e060ed3d94/t/5c7affe5fa0d60728a773fd1/1551564774337/dont-stop-believing.pdf" target="_blank" rel="noopener">Brooks et al., 2016</a> · <a href="https://Www.Gwern.net/doc/psychology/2006-frattaroli.pdf" target="_blank" rel="noopener">Frattaroli, 2006</a> · <a href="https://blogs.ucl.ac.uk/bsh/2012/06/29" target="_blank" rel="noopener">Lally et al., 2010</a></p></section>
  <button class="btn" data-act="home">${store.get("session") ? "Back to my crossing" : "Back to the start"}</button>`;
}

    <h2>${esc(card.name)}</h2>
    <p class="muted">${esc(card.meaning)}</p>
    <a class="link" href="https://tarotsimplify.sarathms.com/" target="_blank" rel="noopener">Learn this card in Tarot Simplify</a>
  </section>
  <section class="panel">
    <p class="question">${esc(question)}</p>
    ${weatherPicker()}
    <label for="entry" class="muted small">Write for a few minutes. No word count, no right answer.</label>
    <textarea id="entry" maxlength="6000" placeholder="Whatever comes."></textarea>
    <button class="btn" id="close">Close the evening</button>
    <p class="error" id="err" hidden></p>
  </section>`;
  const ta = document.getElementById("entry"), draftKey = "draft." + (ev.crossing_id || "anon") + "." + ev.n;
  ta.value = store.get(draftKey) || "";
  ta.oninput = () => store.set(draftKey, ta.value);
  let weather = null;
  app.querySelectorAll("#wx .chip").forEach((b) => b.onclick = () => { app.querySelectorAll("#wx .chip").forEach((x) => x.setAttribute("aria-pressed", x === b)); weather = b.dataset.w; });
  document.getElementById("close").onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = "The Reader is reading…";
    try { const out = await onClose(ta.value.trim(), weather); store.set(draftKey, null); renderAfter(ev, card, out); }
    catch (er) { const x = document.getElementById("err"); x.textContent = er.message; x.hidden = false; e.target.disabled = false; e.target.textContent = "Close the evening"; }
  };
}
const readingHtml = (r) => `<section class="panel reading"><span class="eyebrow">Your reading · week ${r.week}</span>${r.text.reflections.map((x) => `<p>${esc(x)}</p>`).join("")}<p class="question">${esc(r.text.question)}</p></section>`;
function renderAfter(ev, card, out) {
  const r = out.reading, weekly = r && r.week < 99, final = r && r.week === 99;
  app.innerHTML = `${topBar(store.get("user"))}
  <section class="panel"><span class="eyebrow">The Reader</span><p class="reader">${esc(out.reader_line)}</p></section>
  ${out.needs_support ? supportBox() : ""}
  ${weekly ? `<section class="panel" id="weekcheck"><span class="eyebrow">End of week ${r.week} · check-in</span><h3>Where are you now?</h3>
    <p class="muted small">Same three readings as when you began. Then your weekly reading opens.</p>${compassHtml("week")}
    <button class="btn" id="savecheck">Save and open my reading</button><p class="error" id="err" hidden></p></section><div id="readingslot"></div>` : ""}
  <button class="btn ${weekly ? "ghost" : ""}" data-act="${final ? "returncheck" : out.next || "home"}">${out.cta || (final ? "Close your crossing" : "Back to your crossing")}</button>`;
  if (weekly) document.getElementById("savecheck").onclick = async (e) => {
    e.target.disabled = true;
    try { await api("/checkin", { crossing_id: app._crossing.id, kind: "week", week: r.week, ...readCompass("week") }); document.getElementById("weekcheck").remove(); document.getElementById("readingslot").innerHTML = readingHtml(r); }
    catch (er) { const x = document.getElementById("err"); x.textContent = er.message; x.hidden = false; e.target.disabled = false; }
  };
}
async function renderReturnCheck() {
  setSky("return");
  const b = await api("/crossing");
  const c = b.crossing; app._crossing = c;
  let answer = null;
  app.innerHTML = `${topBar(store.get("user"))}
  <section class="panel"><span class="eyebrow">The Return · closing your crossing</span><h2>Two last questions before your Scroll.</h2>
    ${c.intention ? `<p><span class="muted small">When you began, you wrote that this crossing would be worth it if:</span><br><span class="question">${esc(c.intention)}</span></p>` : ""}
    <h3>Did you find what you came for?</h3>
    <div class="chips" id="ans">${Object.entries(ANSWERS).map(([k, v]) => `<button class="chip" aria-pressed="false" data-a="${k}">${v}</button>`).join("")}</div>
    <textarea id="anote" maxlength="1000" style="min-height:70px" placeholder="Anything you want to say about it (optional)."></textarea></section>
  <section class="panel"><span class="eyebrow">Your compass · now</span>${compassHtml("ret")}</section>
  <button class="btn" id="finish" disabled>See your Crossing Scroll</button><p class="error" id="err" hidden></p>`;
  app.querySelectorAll("#ans .chip").forEach((x) => x.onclick = () => { app.querySelectorAll("#ans .chip").forEach((y) => y.setAttribute("aria-pressed", y === x)); answer = x.dataset.a; document.getElementById("finish").disabled = false; });
  document.getElementById("finish").onclick = async (e) => {
    e.target.disabled = true;
    try {
      await api("/checkin", { crossing_id: c.id, kind: "return", ...readCompass("ret") });
      renderScroll(await api("/crossing/outcome", { crossing_id: c.id, answer, note: document.getElementById("anote").value.trim() }));
    } catch (er) { const x = document.getElementById("err"); x.textContent = er.message; x.hidden = false; e.target.disabled = false; }
  };
}

async function openEvening() {
  const c = app._crossing;
  const { evening } = await api("/evening/offer", { crossing_id: c.id });
  evening.crossing_id = c.id;
  const reveal = (card, question) => renderReveal(evening, card, question, (entry, weather) => api("/evening/entry", { crossing_id: c.id, n: evening.n, entry, weather }));
  if (evening.picked) return reveal(CARD[evening.picked], evening.question);
  renderPicks(evening, async (id) => { const out = await api("/evening/pick", { crossing_id: c.id, n: evening.n, card_id: id }); reveal(out.card, out.question); });
}

// ---------- A single dusk without signing in ----------
function anonOffer(n, recent) {
  if (n === 3) return ["fool"];
  const pool = CARDS.filter((c) => c.movement === movementFor(3, n) && c.fixed !== "final" && !recent.includes(c.id));
  const out = []; while (out.length < 3) { const c = pool[Math.floor(Math.random() * pool.length)]; if (!out.includes(c.id)) out.push(c.id); }
  return out;
}
function renderAnonOffer() {
  const a = store.get("anon");
  if (!a) return renderBegin({ anon: true });
  let ev = a.evenings.find((e) => e.entry == null);
  if (!ev) {
    if (a.evenings.length >= 3) return renderAnonScroll();
    ev = { n: a.evenings.length + 1, movement: movementFor(3, a.evenings.length + 1), offered: anonOffer(a.evenings.length + 1, a.evenings.map((e) => e.picked)) };
    a.evenings.push(ev); store.set("anon", a);
  }
  const reveal = () => renderReveal(ev, CARD[ev.picked], ev.question, async (entry, weather) => {
    const out = await api("/anon/reflect", { card_id: ev.picked, n: ev.n, question: ev.question, entry, weather, junction_words: a.junction_words, earlier: a.evenings.filter((x) => x.n < ev.n) });
    Object.assign(ev, { entry, weather, reader_line: out.line }); store.set("anon", a);
    return { reader_line: out.line, needs_support: out.needs_support, next: ev.n < 3 ? "anonnext" : "anonscroll", cta: ev.n < 3 ? "Turn to the next card" : "Receive your Crossing Scroll" };
  });
  if (ev.picked) return reveal();
  renderPicks(ev, async (id) => { ev.picked = id; ev.question = CARD[id].questions[0]; store.set("anon", a); reveal(); });
}
function renderAnonScroll() {
  setSky("return");
  const a = store.get("anon");
  app.innerHTML = `${topBar()}
  <section class="panel" style="text-align:center"><span class="eyebrow">One dusk · complete</span><h2>Your Crossing Scroll</h2>
  <div class="strip" style="grid-template-columns:repeat(3,1fr);max-width:300px;margin:0 auto">${a.evenings.map((e) => mini(e.picked)).join("")}</div></section>
  ${a.evenings.some((e) => e.weather) ? `<section class="panel"><span class="eyebrow">Tonight's weather</span>${weatherStrip(a.evenings)}</section>` : ""}
  <section class="panel">${a.evenings.map(entryHtml).join("")}</section>
  <section class="panel"><p>A longer crossing gives the Reader time to notice patterns across your evenings.</p><div class="signin"><div id="gsi"></div></div>
  <button class="link" data-act="anonreset">Start another single dusk</button></section>`;
  mountGoogle();
}

// ---------- The Crossing Scroll ----------
function renderScroll(b) {
  setSky("return");
  const c = b.crossing, closing = b.readings.find((r) => r.week === 99);
  const ev = b.evenings.filter((e) => e.picked);
  app.innerHTML = `${topBar(store.get("user"))}
  <section class="panel" style="text-align:center"><span class="eyebrow">Evening ${c.length} · The Return</span><h2>Your Crossing Scroll</h2>
  <p class="muted small">${c.length} cards · ${fmtDate(c.start_date)} → ${fmtDate(c.return_date)}</p>
  <div class="strip">${ev.map((e) => mini(e.picked)).join("")}</div></section>
  ${c.outcome_answer ? "" : `<section class="panel"><p>Two last questions close your crossing and complete the picture of how you moved.</p><button class="btn" data-act="returncheck">Close your crossing</button></section>`}
  ${movedPanel(b)}
  ${closing ? `<section class="panel"><span class="eyebrow">The Reader</span><p class="reader">${esc(closing.text.closing)}</p></section>` : ""}
  <section class="panel">${ev.map(entryHtml).join("")}</section>
  <button class="btn" data-act="newcrossing">Begin a new crossing</button>`;
}

// ---------- Menu ----------
function renderMenu() {
  const user = store.get("user");
  app.innerHTML = `${topBar(user)}
  <section class="panel"><span class="eyebrow">Signed in</span><p>${esc(user?.name)}<br><span class="muted small">${esc(user?.email)}</span></p>
  <button class="btn ghost" data-act="home">Back to my crossing</button>
  <button class="btn ghost" data-act="guide">How Dusk works</button>
  <button class="btn ghost" data-act="newcrossing">Start a different crossing</button>
  <button class="btn ghost" data-act="toggletest">${testMode() ? "Turn test mode off" : "Turn test mode on (open evenings any time)"}</button>
  ${installHtml()}
  <button class="btn soft" data-act="signout">Sign out</button></section>`;
}

// ---------- Routing ----------
app.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act;
  if (act !== "home" && act !== "signout" && !history.state) history.pushState({ dusk: 1 }, "");
  if (act === "home" && history.state) history.replaceState(null, "");
  try {
    if (act === "home") route();
    else if (act === "anon") renderBegin({ anon: true });
    else if (act === "anonnext") renderAnonOffer();
    else if (act === "anonscroll") renderAnonScroll();
    else if (act === "anonreset") { store.set("anon", null); renderBegin({ anon: true }); }
    else if (act === "offer") { t.disabled = true; await openEvening(); }
    else if (act === "locate") locate();
    else if (act === "guide") renderGuide();
    else if (act === "returncheck") { t.disabled = true; await renderReturnCheck(); }
    else if (act === "install") { if (installEvent) { installEvent.prompt(); await installEvent.userChoice; installEvent = null; route(); } }
    else if (act === "menu") renderMenu();
    else if (act === "newcrossing") renderBegin();
    else if (act === "toggletest") { store.set("test", testMode() ? null : true); renderMenu(); }
    else if (act === "signout") { store.set("session", null); store.set("user", null); window.google?.accounts?.id?.disableAutoSelect?.(); route(); }
    else if (act === "devlogin") { const out = await api("/auth/dev", {}); store.set("session", out.session); store.set("user", out.user); route(); }
  } catch (er) { t.disabled = false; alertBox(er.message); }
});
function alertBox(msg) { const p = document.createElement("p"); p.className = "error"; p.textContent = msg; app.appendChild(p); }
window.addEventListener("popstate", () => route());
function anonInProgress() {
  const a = store.get("anon");
  if (!a || !a.evenings || !a.evenings.length) return null;
  const done = a.evenings.filter((e) => e.entry != null).length;
  return done >= 3 ? null : { next: Math.min(done + 1, 3) };
}
function route() {
  if (store.get("session")) return renderHome();
  renderWelcome();
}
fetch("cards.json").then((r) => r.json()).then((c) => { CARDS = c; CARD = Object.fromEntries(c.map((x) => [x.id, x])); route(); })
  .catch(() => { app.innerHTML = `<p class="error">Dusk couldn't load its cards. Refresh to try again.</p>`; });
</script>
</body>
</html>
